schemes:
- name: bearerAuth
  type: http
  scheme: bearer
  bearerFormat: OAuth2
  description: Long-lived OAuth 2.0 bearer token issued via the MLS Grid web application token
    tab.
  sources:
  - openapi/mlsgrid-lookup-api-openapi.yml
  - openapi/mlsgrid-media-api-openapi.yml
  - openapi/mlsgrid-member-api-openapi.yml
  - openapi/mlsgrid-metadata-api-openapi.yml
