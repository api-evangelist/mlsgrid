apiVersion: naftiko.dev/v1
kind: Capability
metadata:
  name: mlsgrid-member-replication
  title: Replicate MLS Grid Member records
  description: Incrementally replicate Member (agent) records from one or more MLS Grid originating systems.
  provider: mlsgrid
  api: mlsgrid-reso-web-api
spec:
  binding:
    method: GET
    url: https://api.mlsgrid.com/v2/Member
    auth: bearer
  inputs:
  - name: originatingSystemName
    type: string
    required: true
  - name: modifiedSince
    type: string
    format: date-time
    required: true
  query:
    $filter: OriginatingSystemName eq '{originatingSystemName}' and ModificationTimestamp gt {modifiedSince}
  pagination:
    type: odata-next-link
    nextField: '@odata.nextLink'
  rateLimits:
    rps: 2
    perHour: 7200
    perDay: 40000
