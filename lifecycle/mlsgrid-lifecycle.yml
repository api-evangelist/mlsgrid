infrastructure_migrations:
- date: '2026-09-08'
  title: Media delivery migrated off Amazon AWS
  announced: '2026-08-04'
  notice_days: 35
  breaking: true
  detail: >-
    Media moved from Amazon S3/CloudFront to media.mlsgrid.com. New MediaURLs are signed, single-use
    and expire one hour after generation; S3 bucket-to-bucket transfer was withdrawn outright and
    CloudFront consumers had to repoint at the MLS Grid-operated CDN. This is the clearest example of
    how MLS Grid actually retires a capability: a dated notice in the documentation with roughly five
    weeks of warning and repeated email reminders, in the absence of any written deprecation policy
    or RFC 8594 header support.
  url: https://docs.mlsgrid.com/releases/upcoming-changes-to-media-delivery-migration-away-from-amazon-aws.md
