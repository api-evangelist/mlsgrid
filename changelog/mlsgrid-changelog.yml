method: searched
source: https://docs.mlsgrid.com/llms.txt
docs:
- https://docs.mlsgrid.com/
- https://www.mlsgrid.com/news
scheme:
  api_version: uri-path (v2)
  api_version_current: '2.0'
  release_notes: >-
    MLS Grid does not version the API on a release train. Change is announced per originating MLS as
    dated "Release" and "Recent Release" notices in the documentation site, each naming the MLS
    affected, the date of change, the resources affected and the type of change (field name changes,
    fields added, lookup name changes, legacy fields deprecated, new expandable resources, new MLS
    sources, IDX/VOW rules changes).
  advance_notice: >-
    Notices are published ahead of the effective date and are addressed to the technical contact on
    each data subscription; several also arrive by email to the vendor account primary contact.
  breaking_change_pattern: >-
    Field renames and lookup renames are the common breaking shape. Changes normally apply only to
    new or modified records after the release, not to records already replicated — except an MLS
    system migration (MARIS, 2025-05-12), which required a full re-import.
window: Entries published on docs.mlsgrid.com as of 2026-07-26 (36 notices, 2025-02-18 to 2026-06-05).
